# Verba Manent IA per iPhone (prova): lo costruisce GitHub con Briefcase (BeeWare).
# Le pagine e il motore sono quelli del programma (cartella app), copiati in src/verbamanent/rl durante la costruzione.
[tool.briefcase]
project_name = "Verba Manent IA"
bundle = "it.puntowebferrara"
version = "0.1.0"
url = "https://verbamanent.app/"
author = "Punto Web Ferrara"
author_email = "info@puntowebferrara.com"

[tool.briefcase.app.verbamanent]
formal_name = "Verba Manent IA"
description = "Registra lezioni e riunioni e prepara gli appunti."
long_description = "Registra lezioni e riunioni, le trascrive sul telefono e prepara appunti, flashcard e verbali."
sources = ["src/verbamanent"]
requires = ["numpy", "pillow", "fpdf2==2.8.9"]
permission.microphone = "Serve per registrare la lezione o la riunione."

[tool.briefcase.app.verbamanent.iOS]
requires = ["toga-iOS"]
