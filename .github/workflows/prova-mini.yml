name: Prova mini finestra

# Si lancia a mano (o da Claude): apre il programma vero su Windows e controlla la mini finestra.
on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installa le librerie
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prova
        shell: pwsh
        timeout-minutes: 15
        run: |
          python tools/prova_mini.py
          Get-Content prova_mini/esito.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-mini
          path: prova_mini/
