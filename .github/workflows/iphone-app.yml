name: App iPhone

# Costruisce Verba Manent IA per l'iPhone VERO.
# - Senza le chiavi di Apple: controlla solo che si costruisca (niente firma, niente invio).
# - Con le chiavi (segreti APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): firma e manda a TestFlight.
# Ogni versione di TestFlight vale 90 giorni: il primo giorno dei mesi dispari si ricostruisce da sola.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 1,3,5,7,9,11 *'

permissions:
  contents: write

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Il programma dentro l'app
        run: |
          bash tools/prova_android/prepara_rl.sh ios/src/verbamanent/rl
          cp android/app/src/main/python/avvio_android.py ios/src/verbamanent/

      - name: Riconoscitore vocale (whisper.cpp) per l'iPhone vero, con Metal
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp ios/native/whisper.cpp
          cmake -S ios/native -B /tmp/vmw -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
                -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO > /tmp/vmw.txt 2>&1 || (tail -40 /tmp/vmw.txt; exit 1)
          cmake --build /tmp/vmw --config Release --target vmwhisper -- -quiet > /tmp/vmw2.txt 2>&1 || (grep -m30 -i error /tmp/vmw2.txt; exit 1)
          F=$(find /tmp/vmw -name "libvmwhisper.dylib" | head -1)
          file "$F"
          cp "$F" ios/src/verbamanent/vmwhisper.so

      - name: Progetto Xcode (Briefcase)
        working-directory: ios
        run: |
          python -m pip install -q --upgrade pip briefcase
          briefcase create iOS --no-input 2>&1 | tail -30
          # numero di costruzione sempre nuovo (Apple non accetta due invii con lo stesso numero)
          PL=$(find build -name "*-Info.plist" -path "*xcode*" | head -1)
          V=$(python -c "import json;print(json.load(open('../android/versione.json'))['versione'])" 2>/dev/null || echo 0.1.0)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PL"
          echo "versione $V ($GITHUB_RUN_NUMBER)"

      - name: Costruisci (senza firma, se mancano le chiavi di Apple)
        if: env.P8 == ''
        working-directory: ios
        run: |
          P=$(find build -name "*.xcodeproj" -path "*xcode*" | head -1)
          mkdir -p ../esito-app
          xcodebuild -list -project "$P" | tee ../esito-app/progetto.txt
          set -o pipefail
          xcodebuild -project "$P" -scheme "Verba Manent IA" -configuration Release -sdk iphoneos \
                     -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 \
                     | grep -E "error|warning: .*(dylib|framework)|BUILD|\*\*" | tail -80 | tee ../esito-app/costruzione.txt
          echo "✓ L'app per l'iPhone vero si costruisce. Per mandarla a TestFlight servono le chiavi di Apple."

      - name: Firma e manda a TestFlight
        if: env.P8 != ''
        working-directory: ios
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          K=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          printf '%s' "$P8" > "$K"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $K -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          P=$(find build -name "*.xcodeproj" -path "*xcode*" | head -1)
          xcodebuild -project "$P" -scheme "Verba Manent IA" -configuration Release -sdk iphoneos \
                     -destination 'generic/platform=iOS' -archivePath /tmp/vm.xcarchive \
                     DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic $AUTH archive -quiet
          cat > /tmp/esporta.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath /tmp/vm.xcarchive -exportOptionsPlist /tmp/esporta.plist \
                     -exportPath /tmp/vm-export $AUTH
          rm -f "$K"
          echo "✓ Mandata a TestFlight: tra pochi minuti compare nell'app TestFlight."

      - name: Pubblica l'esito
        if: always()
        run: |
          mkdir -p esito-app && date -u > esito-app/quando.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin iphone-prove
          git worktree add -q /tmp/pub origin/iphone-prove
          rm -rf /tmp/pub/esito-app && cp -R esito-app /tmp/pub/esito-app
          cd /tmp/pub && git add -A esito-app && (git commit -q -m "App iPhone $(date -u +%d/%m\ %H:%M)" || true)
          git push -q origin HEAD:iphone-prove
