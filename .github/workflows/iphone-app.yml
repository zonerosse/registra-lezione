name: App iPhone

# Costruisce Verba Manent IA e Scripta Manent per l'iPhone VERO (due app: stesso codice, edizioni diverse).
# - Senza le chiavi di Apple: controlla solo che si costruisca (niente firma, niente invio).
# - Con le chiavi (segreti APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): firma e manda a TestFlight.
# Ogni versione di TestFlight vale 90 giorni: il primo giorno dei mesi dispari si ricostruisce da sola.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app"
        type: choice
        options: [entrambe, verbamanent, scriptamanent]
        default: entrambe
  schedule:
    - cron: '17 5 1 1,3,5,7,9,11 *'

permissions:
  contents: write

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1        # una app alla volta: due firme insieme si pestano i piedi con Apple
      matrix:
        app: ${{ fromJSON(inputs.app == 'verbamanent' && '["verbamanent"]' || inputs.app == 'scriptamanent' && '["scriptamanent"]' || '["verbamanent","scriptamanent"]') }}
    env:
      APP: ${{ matrix.app }}
      NOME: ${{ matrix.app == 'scriptamanent' && 'Scripta Manent' || 'Verba Manent IA' }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      # gli identificativi del programma presso Google (accesso a Google Drive): nella cassaforte di GitHub
      - name: Identificativi del cloud
        env:
          NUVOLA_APP: ${{ secrets.NUVOLA_APP }}
        run: |
          if [ -n "$NUVOLA_APP" ]; then printf '%s' "$NUVOLA_APP" > app/nuvola_app.json; fi

      - name: Il programma dentro l'app
        run: |
          bash tools/prova_android/prepara_rl.sh ios/src/verbamanent/rl
          cp android/app/src/main/python/avvio_android.py ios/src/verbamanent/

      - name: Riconoscitore vocale (whisper.cpp) per l'iPhone vero, con Metal
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp ios/native/whisper.cpp
          cmake -S ios/native -B /tmp/vmw -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
                -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO > /tmp/vmw.txt 2>&1 || (tail -40 /tmp/vmw.txt; exit 1)
          cmake --build /tmp/vmw --config Release --target vmwhisper -- -quiet > /tmp/vmw2.txt 2>&1 || (grep -m30 -i error /tmp/vmw2.txt; exit 1)
          F=$(find /tmp/vmw -name "libvmwhisper.dylib" | head -1)
          file "$F"
          cp "$F" ios/src/verbamanent/vmwhisper.so

      - name: Progetto Xcode (Briefcase)
        working-directory: ios
        run: |
          python -m pip install -q --upgrade pip briefcase
          briefcase create iOS -a "$APP" --no-input 2>&1 | tail -30
          # Apple non accetta librerie statiche (.a) dentro l'app: quelle di numpy non servono a niente
          find "build/$APP" -path "*app_packages*" -name "*.a" -print -delete
          # numero di costruzione sempre nuovo (Apple non accetta due invii con lo stesso numero)
          # il file Info.plist dell'app (non quelli delle librerie dentro app_packages)
          PL=$(find "build/$APP" -name "*-Info.plist" -path "*xcode*" -not -path "*app_packages*" -not -path "*Support*" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          echo "Info.plist: $PL"; test -f "$PL"
          V=$(python -c "import json;print(json.load(open('../android/versione.json'))['versione'])" 2>/dev/null || echo 0.1.0)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PL"
          # usa solo la cifratura standard (HTTPS): così TestFlight non chiede ogni volta la «conformità all'esportazione»
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
          echo "versione $V ($GITHUB_RUN_NUMBER)"

      - name: Costruisci (senza firma, se mancano le chiavi di Apple)
        if: env.P8 == ''
        working-directory: ios
        run: |
          P=$(find "build/$APP" -name "*.xcodeproj" -path "*xcode*" | head -1)
          mkdir -p ../esito-app
          xcodebuild -list -project "$P" | tee ../esito-app/progetto.txt
          set -o pipefail
          xcodebuild -project "$P" -scheme "$NOME" -configuration Release -sdk iphoneos \
                     -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO EXPANDED_CODE_SIGN_IDENTITY=- build 2>&1 \
                     | grep -E "error|warning: .*(dylib|framework)|BUILD|\*\*" | tail -80 | tee ../esito-app/costruzione.txt
          echo "✓ L'app per l'iPhone vero si costruisce. Per mandarla a TestFlight servono le chiavi di Apple."

      # il Bundle ID dell'app (es. it.puntowebferrara.scriptamanent): se in Apple non c'e' ancora, lo registro io con la chiave API
      - name: Bundle ID in Apple
        if: env.P8 != ''
        run: |
          python -m pip install -q pyjwt cryptography
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          bid = "it.puntowebferrara." + os.environ["APP"]
          tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           os.environ["P8"], algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          def api(m, u, d=None):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/" + u, method=m, data=json.dumps(d).encode() if d else None,
                                         headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              with urllib.request.urlopen(r, timeout=30) as x:
                  return json.loads(x.read() or b"{}")
          if api("GET", "bundleIds?filter[identifier]=" + bid).get("data"):
              print("Bundle ID gia' registrato:", bid)
          else:
              try:
                  api("POST", "bundleIds", {"data": {"type": "bundleIds", "attributes": {"identifier": bid, "name": os.environ["NOME"], "platform": "IOS"}}})
                  print("Bundle ID registrato:", bid)
              except urllib.error.HTTPError as e:
                  print("Bundle ID non registrato:", e.code, e.read()[:400])
          app = api("GET", "apps?filter[bundleId]=" + bid).get("data")
          print("App in App Store Connect:", "c'e'" if app else "MANCA: crearla in App Store Connect con questo Bundle ID")
          PY

      - name: Firma e manda a TestFlight
        if: env.P8 != ''
        working-directory: ios
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          K=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          printf '%s' "$P8" > "$K"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $K -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          P=$(find "build/$APP" -name "*.xcodeproj" -path "*xcode*" | head -1)
          mkdir -p ../esito-app
          set -o pipefail
          xcodebuild -project "$P" -scheme "$NOME" -configuration Release -sdk iphoneos \
                     -destination 'generic/platform=iOS' -archivePath /tmp/vm.xcarchive \
                     DEVELOPMENT_TEAM=$TEAM CODE_SIGNING_ALLOWED=NO EXPANDED_CODE_SIGN_IDENTITY=- archive > /tmp/archivio.txt 2>&1 \
            || { grep -E "error|Error|ERROR|warning: .*(sign|provision)|\*\*" /tmp/archivio.txt | tail -80 > ../esito-app/firma.txt; tail -60 /tmp/archivio.txt >> ../esito-app/firma.txt; cat ../esito-app/firma.txt; exit 65; }
          echo "archivio fatto" > ../esito-app/firma.txt
          cat > /tmp/esporta.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath /tmp/vm.xcarchive -exportOptionsPlist /tmp/esporta.plist \
                     -exportPath /tmp/vm-export $AUTH > /tmp/invio.txt 2>&1 \
            || { grep -E "error|Error|ERROR" /tmp/invio.txt | tail -60 > ../esito-app/invio.txt; tail -60 /tmp/invio.txt >> ../esito-app/invio.txt; cat ../esito-app/invio.txt; exit 66; }
          echo "inviato" > ../esito-app/invio.txt
          rm -f "$K"
          echo "✓ Mandata a TestFlight: tra pochi minuti compare nell'app TestFlight."

      - name: Pubblica l'esito
        if: always()
        run: |
          mkdir -p esito-app && date -u > esito-app/quando.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin iphone-prove
          git worktree add -q /tmp/pub origin/iphone-prove
          rm -rf /tmp/pub/esito-app-$APP && cp -R esito-app /tmp/pub/esito-app-$APP
          cd /tmp/pub && git add -A esito-app-$APP && (git commit -q -m "App iPhone $APP $(date -u +%d/%m\ %H:%M)" || true)
          git push -q origin HEAD:iphone-prove || (git pull -q --rebase origin iphone-prove && git push -q origin HEAD:iphone-prove)
