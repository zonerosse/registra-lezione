name: Prova iPhone

# Costruisce Verba Manent IA per iPhone (Briefcase) e la prova sull'iPhone simulato di GitHub, senza account Apple.
# Foto dello schermo e registro finiscono nel ramo «iphone-prove».
on:
  workflow_dispatch:
    inputs:
      dispositivo:
        description: "Su quale dispositivo simulato"
        type: choice
        options: [iphone, ipad]
        default: iphone

permissions:
  contents: write

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # gli identificativi del programma presso Google (accesso a Google Drive): nella cassaforte di GitHub
      - name: Identificativi del cloud
        env:
          NUVOLA_APP: ${{ secrets.NUVOLA_APP }}
        run: |
          if [ -n "$NUVOLA_APP" ]; then printf '%s' "$NUVOLA_APP" > app/nuvola_app.json; fi

      - name: Il programma dentro l'app
        run: |
          bash tools/prova_android/prepara_rl.sh ios/src/verbamanent/rl
          cp android/app/src/main/python/avvio_android.py ios/src/verbamanent/

      - name: Riconoscitore vocale (whisper.cpp) per l'iPhone simulato
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp ios/native/whisper.cpp
          cmake -S ios/native -B /tmp/vmw -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
                -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO > /tmp/vmw.txt 2>&1 || (tail -40 /tmp/vmw.txt; exit 1)
          cmake --build /tmp/vmw --config Release --target vmwhisper -- -quiet > /tmp/vmw2.txt 2>&1 || (grep -m30 -i error /tmp/vmw2.txt; exit 1)
          F=$(find /tmp/vmw -name "libvmwhisper.dylib" | head -1)
          file "$F"; otool -L "$F"
          cp "$F" ios/src/verbamanent/vmwhisper.so

      - name: Costruisci per l'iPhone simulato
        id: costruisci
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../esito
          ls /Applications | grep -i xcode | tee ../esito/costruzione.txt
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; B=briefcase; else B="briefcase<0.4"; fi
          xcodebuild -version | tee -a ../esito/costruzione.txt
          python -m pip install -q --upgrade pip "$B" 2>&1 | tail -5 | tee -a ../esito/costruzione.txt
          briefcase --version | tee -a ../esito/costruzione.txt
          briefcase create iOS -a verbamanent --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt
          find build -name project.pbxproj -exec sed -i '' -E 's/TARGETED_DEVICE_FAMILY = [^;]*;/TARGETED_DEVICE_FAMILY = "1,2";/' {} \;
          grep -h "TARGETED_DEVICE_FAMILY" $(find build -name project.pbxproj) | sort -u | tee -a ../esito/costruzione.txt
          briefcase build iOS -a verbamanent --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt

      - name: Prova sull'iPhone simulato
        if: steps.costruisci.outcome == 'success'
        run: |
          mkdir -p esito
          APP=$(find ios/build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "app: $APP" | tee esito/app.txt
          ID=it.puntowebferrara.verbamanent
          if [ "${{ inputs.dispositivo }}" = "ipad" ]; then
            DEV=$(xcrun simctl list devices available | grep -m1 -E "iPad (Air|Pro)" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          else
            DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7]( |$)" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          echo "simulatore: $DEV" | tee -a esito/app.txt
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant microphone $ID || true
          # riconoscitore e un audio di prova dentro l'app, cosi' la prova di trascrizione parte subito
          DATI=$(xcrun simctl get_app_container "$DEV" $ID data)
          curl -sL -o "$DATI/ggml-small-q5_1.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          cp ios/native/whisper.cpp/samples/jfk.wav "$DATI/prova_whisper.wav"
          pip install -q fpdf2 && python -c "
          from fpdf import FPDF
          p = FPDF()
          for t in ('Slide 1', 'Slide 2'):
              p.add_page(); p.set_font('helvetica', size=40); p.cell(text=t)
          p.output('$DATI/prova.pdf')"
          xcrun simctl launch --stdout=$PWD/esito/stdout.txt --stderr=$PWD/esito/stderr.txt "$DEV" $ID
          sleep 60
          xcrun simctl io "$DEV" screenshot esito/01-avvio.png
          for i in $(seq 1 36); do [ -f "$DATI/prova_whisper.txt" ] && break; sleep 5; done
          cp "$DATI/prova_whisper.txt" esito/ 2>/dev/null || echo "nessun esito dopo 3 minuti" > esito/prova_whisper.txt
          cp "$DATI/prova_audio.txt" esito/ 2>/dev/null || true
          cp "$DATI/prova_pdf/p001.png" esito/pdf-p001.png 2>/dev/null || true
          find "$DATI" -name "*.log" -exec cp {} esito/ \; || true
          cp "$DATI/Documents/errore_avvio.txt" esito/ 2>/dev/null || true
          if [ -f "$DATI/porta.txt" ]; then
            P=$(cat "$DATI/porta.txt")
            api() { echo "== $1 $2" >> esito/api.txt; curl -s -m 30 -X POST -d "$2" http://127.0.0.1:$P/api/$1 >> esito/api.txt; echo >> esito/api.txt; }
            curl -s -X POST -d '[]' http://127.0.0.1:$P/api/riepilogo > esito/riepilogo.json || true
            # prova di registrazione: 20 secondi dal microfono simulato
            api imposta '["privacy_ok", true]'
            api imposta '["lingua", "it"]'
            api avvia '["Prova iPhone", {"modo": "", "tipo": "lezione"}]'
            sleep 20
            api stato '[]'
            xcrun simctl io "$DEV" screenshot esito/02-registra.png
            api fine '[]'
            sleep 10
          fi
          xcrun simctl io "$DEV" screenshot esito/03-dopo.png
          # finestre di iOS: manda, anteprima, scelta di un file (ognuna con l'app riaperta da capo)
          riapri() { xcrun simctl terminate "$DEV" $ID; rm -f "$DATI/porta.txt" "$DATI/prova_whisper.wav"; xcrun simctl launch "$DEV" $ID
                     for i in $(seq 1 30); do [ -f "$DATI/porta.txt" ] && break; sleep 2; done; sleep 8; P=$(cat "$DATI/porta.txt"); }
          finestra() { riapri; echo "== $2 $3" >> esito/api.txt; (curl -s -m 10 -X POST -d "$3" http://127.0.0.1:$P/api/$2 || echo "(aspetta la scelta)") >> esito/api.txt; echo >> esito/api.txt
                       sleep 4; xcrun simctl io "$DEV" screenshot esito/$1.png; }
          if [ -n "$P" ]; then
            finestra 04-condividi condividi "[\"$DATI/prova.pdf\"]"
            finestra 05-anteprima apri "[\"$DATI/prova.pdf\"]"
            finestra 06-scegli scegli_pdf '[]'
            comando() { echo "$2" > "$DATI/prova_comando.json"; riapri; sleep 8; xcrun simctl io "$DEV" screenshot esito/$1.png
                        cp "$DATI/prova_comando_errore.txt" esito/$1-errore.txt 2>/dev/null || true
                        mv "$DATI/prova_comando.log" esito/$1.log 2>/dev/null || true; }
            A=$(( $(date +%s) + 86400 ))000; B=$(( $(date +%s) + 90000 ))000; C=$(( $(date +%s) + 172800 ))000
            rm -f "$DATI/prova_comando.log"
            comando 07-email "[\"email\", [\"sara@esempio.it\"], \"Verbale riunione\", \"Ecco il verbale.\", [\"$DATI/prova.pdf\"]]"
            comando 08-calendario "[\"eventi\", [\"Esame di diritto\", $C, $C, true, \"Portare il libretto\", \"\"], [\"Consegna tesina\", $A, $B, false, \"\", \"Aula 3\"]]"
            comando 09-notifica "[\"notifica\", \"Lezione pronta\", \"Gli appunti di Prova iPhone sono pronti.\"]"
          fi
          # giro completo dell'app come la vede una persona nuova: installazione da capo, poi ogni schermata
          xcrun simctl terminate "$DEV" $ID || true
          xcrun simctl uninstall "$DEV" $ID
          # iPhone riacceso: niente finestre di sistema rimaste aperte dalle prove di prima
          xcrun simctl shutdown "$DEV"; xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant microphone $ID || true
          DATI=$(xcrun simctl get_app_container "$DEV" $ID data)
          touch "$DATI/prova_js_attiva"
          xcrun simctl launch "$DEV" $ID
          for i in $(seq 1 40); do [ -f "$DATI/porta.txt" ] && break; sleep 2; done; sleep 10
          su='document.querySelectorAll("*").forEach(e=>{if(e.scrollHeight>e.clientHeight+40)e.scrollTop=0});window.scrollTo(0,0);'
          giu() { echo "document.querySelectorAll('*').forEach(e=>{if(e.scrollHeight>e.clientHeight+40)e.scrollTop=(e.scrollHeight-e.clientHeight)*$1});window.scrollTo(0,(document.body.scrollHeight)*$1);"; }
          vai() { echo "$su document.querySelector('#nav a[data-p=$1]').click();"; }
          js() { echo "$2" > "$DATI/prova_js.txt"; sleep ${3:-4}; xcrun simctl io "$DEV" screenshot esito/giro-$1.png; }
          mkdir -p esito
          js 01-benvenuto ""
          js 02-prima-di-iniziare "document.querySelector('.velo [data-l=it]').click()"
          js 03-prima-spuntata "$(giu 1) var c=document.querySelector('#pvCk'); c.checked=true; c.onchange();"
          js 04-inizia-qui "document.querySelector('#pvOk').click()" 6
          js 04b-inizia-claude "document.querySelector('#iqSalta').click()"
          js 04c-inizia-pc "document.querySelector('#iqDopo').click()"
          js 04-registra "document.querySelector('#iqNo').click()"
          js 05-registra-meta "$(giu 0.5)"
          js 06-registra-fondo "$(giu 1)"
          js 07-lezioni "$(vai arch)"
          js 08-da-fare "$(vai fare)"
          js 09-impostazioni "$(vai imp)"
          js 10-impostazioni-meta "$(giu 0.5)"
          js 11-impostazioni-fondo "$(giu 1)"
          # invito: un invito di prova (chiave finta) incollato in Impostazioni › Ho un invito e «Attiva»
          INV=$(python3 tools/prove/invito_prova.py)
          P=$(cat "$DATI/porta.txt" 2>/dev/null || true)
          echo "== api invito_attiva (porta $P)" >> esito/api.txt
          [ -n "$P" ] && (curl -s -m 20 -X POST -d "[\"$INV\"]" http://127.0.0.1:$P/api/invito_attiva >> esito/api.txt || echo "curl $?" >> esito/api.txt); echo >> esito/api.txt
          js 11b-invito "$(vai imp) setTimeout(function(){var x=document.querySelector('#hoTxt'); x.scrollIntoView(); x.value='$INV'; document.querySelector('#hoVai').click();},800);" 10
          js 11c-informazioni "document.querySelector('#imInfo').click()"
          js 12-guida "$(vai guida)"
          js 13-guida-meta "$(giu 0.5)"
          js 14-guida-fondo "$(giu 1)"
          js 15-studia-vuota "$(vai studia)"
          js 16-collegati-pc "document.querySelector('[data-stv=sy]').click()" 6
          # per ultimo: «Accedi con Google» apre la pagina di Google dentro l'app (resta aperta: per questo e' l'ultima)
          js 17-google "$su document.querySelector('#nav a[data-p=imp]').click(); setTimeout(function(){ window.iniziaQui(); setTimeout(function(){ var g=document.querySelector('#iqG'); if (g) g.click(); }, 2500); }, 800);" 14
          ls -lR "$DATI" | grep -v "^total" > esito/documenti.txt 2>&1 || true

      - name: Pubblica l'esito
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin iphone-prove || true
          if git rev-parse -q --verify origin/iphone-prove >/dev/null; then
            git worktree add -q /tmp/pub origin/iphone-prove
          else
            git worktree add -q --detach /tmp/pub && (cd /tmp/pub && git checkout -q --orphan iphone-prove && git rm -rqf . || true)
          fi
          mkdir -p esito && date -u > esito/quando.txt
          rm -rf /tmp/pub/esito && cp -R esito /tmp/pub/esito
          cd /tmp/pub
          git add -A esito
          git commit -q -m "Prova iPhone $(date -u +%d/%m\ %H:%M)" || true
          git push -q origin HEAD:iphone-prove
