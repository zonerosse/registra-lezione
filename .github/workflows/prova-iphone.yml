name: Prova iPhone

# Costruisce Verba Manent IA per iPhone (Briefcase) e la prova sull'iPhone simulato di GitHub, senza account Apple.
# Foto dello schermo e registro finiscono nel ramo «iphone-prove».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Il programma dentro l'app
        run: |
          bash tools/prova_android/prepara_rl.sh ios/src/verbamanent/rl
          cp android/app/src/main/python/avvio_android.py ios/src/verbamanent/

      - name: Costruisci per l'iPhone simulato
        id: costruisci
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../esito
          ls /Applications | grep -i xcode | tee ../esito/costruzione.txt
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; B=briefcase; else B="briefcase<0.4"; fi
          xcodebuild -version | tee -a ../esito/costruzione.txt
          python -m pip install -q --upgrade pip "$B" 2>&1 | tail -5 | tee -a ../esito/costruzione.txt
          briefcase --version | tee -a ../esito/costruzione.txt
          briefcase create iOS --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt
          briefcase build iOS --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt

      - name: Prova sull'iPhone simulato
        if: steps.costruisci.outcome == 'success'
        run: |
          mkdir -p esito
          APP=$(find ios/build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "app: $APP" | tee esito/app.txt
          ID=it.puntowebferrara.verbamanent
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7]( |$)" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "simulatore: $DEV" | tee -a esito/app.txt
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant microphone $ID || true
          xcrun simctl launch --stdout=$PWD/esito/stdout.txt --stderr=$PWD/esito/stderr.txt "$DEV" $ID
          sleep 90
          xcrun simctl io "$DEV" screenshot esito/01-avvio.png
          DATI=$(xcrun simctl get_app_container "$DEV" $ID data)
          ls -R "$DATI/Documents" > esito/documenti.txt 2>&1 || true
          find "$DATI" -name "*.log" -exec cp {} esito/ \; || true
          cp "$DATI/Documents/errore_avvio.txt" esito/ 2>/dev/null || true
          if [ -f "$DATI/Documents/porta.txt" ]; then
            P=$(cat "$DATI/Documents/porta.txt")
            curl -s -X POST -d '[]' http://127.0.0.1:$P/api/riepilogo > esito/riepilogo.json || true
            curl -s -X POST -d '[]' http://127.0.0.1:$P/api/stato > esito/stato.json || true
          fi
          sleep 15
          xcrun simctl io "$DEV" screenshot esito/02-dopo.png

      - name: Pubblica l'esito
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin iphone-prove || true
          if git rev-parse -q --verify origin/iphone-prove >/dev/null; then
            git worktree add -q /tmp/pub origin/iphone-prove
          else
            git worktree add -q --detach /tmp/pub && (cd /tmp/pub && git checkout -q --orphan iphone-prove && git rm -rqf . || true)
          fi
          mkdir -p esito && date -u > esito/quando.txt
          rm -rf /tmp/pub/esito && cp -R esito /tmp/pub/esito
          cd /tmp/pub
          git add -A esito
          git commit -q -m "Prova iPhone $(date -u +%d/%m\ %H:%M)" || true
          git push -q origin HEAD:iphone-prove
