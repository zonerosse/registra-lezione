name: Prova iPhone

# Costruisce Verba Manent IA per iPhone (Briefcase) e la prova sull'iPhone simulato di GitHub, senza account Apple.
# Foto dello schermo e registro finiscono nel ramo «iphone-prove».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Il programma dentro l'app
        run: |
          bash tools/prova_android/prepara_rl.sh ios/src/verbamanent/rl
          cp android/app/src/main/python/avvio_android.py ios/src/verbamanent/

      - name: Riconoscitore vocale (whisper.cpp) per l'iPhone simulato
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp ios/native/whisper.cpp
          cmake -S ios/native -B /tmp/vmw -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
                -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO > /tmp/vmw.txt 2>&1 || (tail -40 /tmp/vmw.txt; exit 1)
          cmake --build /tmp/vmw --config Release --target vmwhisper -- -quiet > /tmp/vmw2.txt 2>&1 || (grep -m30 -i error /tmp/vmw2.txt; exit 1)
          F=$(find /tmp/vmw -name "libvmwhisper.dylib" | head -1)
          file "$F"; otool -L "$F"
          cp "$F" ios/src/verbamanent/vmwhisper.so

      - name: Costruisci per l'iPhone simulato
        id: costruisci
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../esito
          ls /Applications | grep -i xcode | tee ../esito/costruzione.txt
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; B=briefcase; else B="briefcase<0.4"; fi
          xcodebuild -version | tee -a ../esito/costruzione.txt
          python -m pip install -q --upgrade pip "$B" 2>&1 | tail -5 | tee -a ../esito/costruzione.txt
          briefcase --version | tee -a ../esito/costruzione.txt
          briefcase create iOS --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt
          briefcase build iOS --no-input 2>&1 | tail -150 | tee -a ../esito/costruzione.txt

      - name: Prova sull'iPhone simulato
        if: steps.costruisci.outcome == 'success'
        run: |
          mkdir -p esito
          APP=$(find ios/build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "app: $APP" | tee esito/app.txt
          ID=it.puntowebferrara.verbamanent
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7]( |$)" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "simulatore: $DEV" | tee -a esito/app.txt
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant microphone $ID || true
          # riconoscitore e un audio di prova dentro l'app, cosi' la prova di trascrizione parte subito
          DATI=$(xcrun simctl get_app_container "$DEV" $ID data)
          curl -sL -o "$DATI/ggml-small-q5_1.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          cp ios/native/whisper.cpp/samples/jfk.wav "$DATI/prova_whisper.wav"
          pip install -q fpdf2 && python -c "
          from fpdf import FPDF
          p = FPDF()
          for t in ('Slide 1', 'Slide 2'):
              p.add_page(); p.set_font('helvetica', size=40); p.cell(text=t)
          p.output('$DATI/prova.pdf')"
          xcrun simctl launch --stdout=$PWD/esito/stdout.txt --stderr=$PWD/esito/stderr.txt "$DEV" $ID
          sleep 60
          xcrun simctl io "$DEV" screenshot esito/01-avvio.png
          for i in $(seq 1 36); do [ -f "$DATI/prova_whisper.txt" ] && break; sleep 5; done
          cp "$DATI/prova_whisper.txt" esito/ 2>/dev/null || echo "nessun esito dopo 3 minuti" > esito/prova_whisper.txt
          cp "$DATI/prova_audio.txt" esito/ 2>/dev/null || true
          cp "$DATI/prova_pdf/p001.png" esito/pdf-p001.png 2>/dev/null || true
          find "$DATI" -name "*.log" -exec cp {} esito/ \; || true
          cp "$DATI/Documents/errore_avvio.txt" esito/ 2>/dev/null || true
          if [ -f "$DATI/porta.txt" ]; then
            P=$(cat "$DATI/porta.txt")
            api() { echo "== $1 $2" >> esito/api.txt; curl -s -m 30 -X POST -d "$2" http://127.0.0.1:$P/api/$1 >> esito/api.txt; echo >> esito/api.txt; }
            curl -s -X POST -d '[]' http://127.0.0.1:$P/api/riepilogo > esito/riepilogo.json || true
            # prova di registrazione: 20 secondi dal microfono simulato
            api imposta '["privacy_ok", true]'
            api imposta '["lingua", "it"]'
            api avvia '["Prova iPhone", {"modo": "", "tipo": "lezione"}]'
            sleep 20
            api stato '[]'
            xcrun simctl io "$DEV" screenshot esito/02-registra.png
            api fine '[]'
            sleep 10
          fi
          xcrun simctl io "$DEV" screenshot esito/03-dopo.png
          # finestre di iOS: manda, anteprima, scelta di un file (ognuna con l'app riaperta da capo)
          riapri() { xcrun simctl terminate "$DEV" $ID; rm -f "$DATI/porta.txt" "$DATI/prova_whisper.wav"; xcrun simctl launch "$DEV" $ID
                     for i in $(seq 1 30); do [ -f "$DATI/porta.txt" ] && break; sleep 2; done; sleep 8; P=$(cat "$DATI/porta.txt"); }
          finestra() { riapri; echo "== $2 $3" >> esito/api.txt; curl -s -m 10 -X POST -d "$3" http://127.0.0.1:$P/api/$2 >> esito/api.txt; echo >> esito/api.txt
                       sleep 4; xcrun simctl io "$DEV" screenshot esito/$1.png; }
          if [ -n "$P" ]; then
            finestra 04-condividi condividi "[\"$DATI/prova.pdf\"]"
            finestra 05-anteprima apri "[\"$DATI/prova.pdf\"]"
            finestra 06-scegli scegli_pdf '[]'
          fi
          ls -lR "$DATI" | grep -v "^total" > esito/documenti.txt 2>&1 || true

      - name: Pubblica l'esito
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin iphone-prove || true
          if git rev-parse -q --verify origin/iphone-prove >/dev/null; then
            git worktree add -q /tmp/pub origin/iphone-prove
          else
            git worktree add -q --detach /tmp/pub && (cd /tmp/pub && git checkout -q --orphan iphone-prove && git rm -rqf . || true)
          fi
          mkdir -p esito && date -u > esito/quando.txt
          rm -rf /tmp/pub/esito && cp -R esito /tmp/pub/esito
          cd /tmp/pub
          git add -A esito
          git commit -q -m "Prova iPhone $(date -u +%d/%m\ %H:%M)" || true
          git push -q origin HEAD:iphone-prove
