name: Costruisci exe

# Parte da solo a ogni push su main. Se la versione scritta in app/versione.json
# e' gia' stata pubblicata non fa niente; se e' nuova costruisce l'exe, lo prova
# e pubblica una "release" con:
#   RegistraLezione-<versione>.zip  pacchetto completo (exe + librerie + app)
#   aggiornamento.zip               solo la cartella app (per il tasto Aggiorna)
#   versione.json                   numero di versione e novita'
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# una costruzione alla volta: se ne parte un'altra mentre questa pubblica, aspetta in fila
# (altrimenti la seconda trova la versione "nuova" e poi fallisce perche' intanto e' stata pubblicata)
concurrency:
  group: costruisci-exe
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Leggi la versione
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $j = Get-Content app/versione.json -Raw -Encoding utf8 | ConvertFrom-Json
          $tag = "v$($j.versione)"
          "versione=$($j.versione)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La versione $tag esiste gia': niente da fare."
            "nuova=0" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Versione nuova: $tag"
            "nuova=1" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-python@v6
        if: steps.v.outputs.nuova == '1'
        with:
          python-version: '3.12'

      - name: Installa le librerie
        if: steps.v.outputs.nuova == '1'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3
          Get-ChildItem app/*.py, *.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }

      - name: Costruisci l'exe
        if: steps.v.outputs.nuova == '1'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "Registra Lezione" --icon app/icona.ico `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all soundcard `
            --collect-all imageio_ffmpeg --collect-all onnxruntime --collect-all av `
            --collect-all tokenizers --collect-all fpdf --collect-all PIL --collect-all mss `
            --collect-all huggingface_hub --collect-all webview --collect-all clr_loader --collect-all pythonnet `
            --collect-submodules fontTools --collect-submodules numpy `
            --hidden-import dipendenze avvio.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prova l'exe e prepara i pacchetti
        if: steps.v.outputs.nuova == '1'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.versione }}"
          $dest = "dist/Registra Lezione"
          Copy-Item app "$dest/app" -Recurse
          Get-ChildItem "$dest/app" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item LEGGIMI.txt $dest
          Copy-Item app/LICENZE.txt $dest

          $p = Start-Process -FilePath "$dest/Registra Lezione.exe" -ArgumentList "--prova" -Wait -PassThru
          $esito = ""
          foreach ($f in "prova_avvio.txt", "errore_avvio.txt") {
            if (Test-Path "$dest/$f") { $esito += "== $f ==`n" + (Get-Content "$dest/$f" -Raw -Encoding utf8) + "`n" }
          }
          if (-not $esito) { $esito = "Nessun file di esito: l'exe non e' partito (codice $($p.ExitCode))" }
          Write-Host $esito
          if ($p.ExitCode -ne 0 -or $esito -notmatch "TUTTO A POSTO") {
            # l'errore va nelle annotazioni, cosi' si legge anche senza aprire il log completo
            $msg = ($esito -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A")
            Write-Host "::error title=Prova dell'exe fallita::$msg"
            exit 1
          }
          Remove-Item "$dest/prova_avvio.txt"
          Get-ChildItem "$dest/app" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

          Move-Item $dest "dist/RegistraLezione"
          Compress-Archive -Path "dist/RegistraLezione" -DestinationPath "RegistraLezione-$v.zip"

          # programma di installazione (un solo file .exe da scaricare e aprire)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersione=$v" installer.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path RegistraLezione-Setup.exe)) { Write-Error "Installazione non creata"; exit 1 }

          New-Item -ItemType Directory solo_app | Out-Null
          Copy-Item app/* solo_app -Recurse
          Get-ChildItem solo_app -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path solo_app/* -DestinationPath aggiornamento.zip
          Copy-Item app/versione.json versione.json

          $j = Get-Content app/versione.json -Raw -Encoding utf8 | ConvertFrom-Json
          $link = "https://github.com/${{ github.repository }}/releases/latest/download/RegistraLezione-Setup.exe"
          $note = "Novità: $($j.novita)`n`n" +
                  "Prima installazione: scarica e apri **[RegistraLezione-Setup.exe]($link)**.`n" +
                  "Chi ha già il programma: tocca **Aggiorna** in fondo alla finestra."
          Set-Content -Path note.md -Value $note -Encoding utf8
          Get-Item "RegistraLezione-$v.zip", RegistraLezione-Setup.exe, aggiornamento.zip | Select-Object Name, Length

      - name: Pubblica la release
        if: steps.v.outputs.nuova == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.versione }}"
          gh release create "${{ steps.v.outputs.tag }}" RegistraLezione-Setup.exe "RegistraLezione-$v.zip" aggiornamento.zip versione.json `
            --title "Verba Manent IA $v" --notes-file note.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
