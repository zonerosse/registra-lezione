name: Prova Android

# Si lancia a mano (o da Claude): costruisce l'app di prova e la prova su un telefono Android simulato.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Strumenti Android (NDK e CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Riconoscitore vocale (whisper.cpp) e modelli
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp android/app/src/main/cpp/whisper.cpp
          mkdir -p modelli
          for m in base-q5_1 small-q5_1; do
            curl -sSL -o modelli/ggml-$m.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin"
          done
          ls -la modelli
      - name: Costruisci l'app
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Attiva la virtualizzazione (per il telefono simulato)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prova sul telefono simulato
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
          script: bash tools/prova_android/prova.sh
      - name: Salva i risultati nel ramo "prova-android"
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p risultati
          cp -R prova_android_out/* risultati/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk risultati/RegistraLezione-prova.apk 2>/dev/null || true
          git checkout --orphan prova-android
          git rm -rf --cached . > /dev/null
          git add -f risultati
          git commit -m "Risultati prova Android"
          git push -f origin prova-android
