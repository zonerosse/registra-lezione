name: Prova Android

# Si lancia a mano (o da Claude): costruisce l'app Android, la prova su un telefono simulato
# e mette l'APK nel ramo "android-app" (da li' l'app si aggiorna con «Aggiorna l'app»).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Strumenti Android (NDK e CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Riconoscitore vocale (whisper.cpp)
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp android/app/src/main/cpp/whisper.cpp
      - name: Il programma (stesso del PC) dentro l'app
        run: |
          R=android/app/src/main/assets/rl
          rm -rf $R; mkdir -p $R
          cp -R app/interfaccia app/_vendor $R/
          for f in app/*.py app/versione.json; do
            case "$(basename $f)" in classica.py|prova_exe.py|registra_lezione.py|manca_edge.py) ;; *) cp $f $R/ ;; esac
          done
          rm -f $R/interfaccia/mini.html
          cp -R android/risorse/font $R/font
          find $R -name __pycache__ -prune -exec rm -rf {} \;
          du -sh $R
      - name: Costruisci l'app
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Attiva la virtualizzazione (per il telefono simulato)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prova sul telefono simulato
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 6144M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
          script: bash tools/prova_android/prova.sh
      - name: Salva i risultati nel ramo "prova-android" e l'app nel ramo "android-app"
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          V=$(python3 -c "import json;print(json.load(open('android/versione.json'))['versione'])")
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/ris /tmp/agg
          cp -R prova_android_out/* /tmp/ris/ 2>/dev/null || true
          cp $APK /tmp/ris/RegistraLezione-prova.apk 2>/dev/null || true
          # l'app si pubblica per «Aggiorna» solo se tutte le prove sono andate bene
          OK=$(python3 -c "import json;e=json.load(open('prova_android_out/esito_app.json'));print(int(bool(e['passi']) and all(p['ok'] for p in e['passi'])))" 2>/dev/null || echo 0)
          echo "prove ok: $OK"
          if [ -f $APK ] && [ "$OK" = "1" ]; then
            cp $APK /tmp/agg/RegistraLezione.apk
            python3 - "$V" <<'PY'
          import json, sys
          v = json.load(open("android/versione.json"))
          v["apk"] = "https://github.com/zonerosse/registra-lezione/raw/android-app/RegistraLezione.apk"
          json.dump(v, open("/tmp/agg/versione-android.json", "w"), ensure_ascii=False, indent=1)
          PY
          fi
          git checkout --orphan prova-android
          git rm -rf --cached . > /dev/null
          rm -rf risultati; mkdir risultati; cp -R /tmp/ris/* risultati/ 2>/dev/null || true
          git add -f risultati
          git commit -q -m "Risultati prova Android $V"
          git push -f origin prova-android
          if [ -f /tmp/agg/RegistraLezione.apk ]; then
            git checkout -q --orphan android-app
            git rm -rf --cached . > /dev/null
            cp /tmp/agg/* .
            git add -f RegistraLezione.apk versione-android.json
            git commit -q -m "App Android $V"
            git push -f origin android-app
          fi
